name: Build and deploy site to GitHub Pages
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node.js packages
        run: npm ci # clean install

      # GITHUB_REPOSITORY decides between the production (FiQCI/fiqci.github.io) and dev site build
      - name: Build site using Astro
        env:
          PUBLIC_MATOMO_URL: mwa-acf.2.rahtiapp.fi
          PUBLIC_MATOMO_TAG_MANAGER_CONTAINER: jyLY2YKH
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
